<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile Settings - AgriPredict</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


    <nav class="navbar">

        <div class="nav-container">

            <div class="nav-brand">
                🌾 AgriPredict
            </div>


            <div class="nav-right">

                <a href="{{ url_for('dashboard') }}"
                   class="nav-home">
                    Home
                </a>


                <div class="profile-dropdown">

                    <button class="profile-button">

                        👤 {{ session.get('user_name', 'User') }}

                        <span>▼</span>

                    </button>


                    <div class="dropdown-content">

                        <a href="{{ url_for('profile') }}">
                            👤 My Profile
                        </a>

                        <a href="{{ url_for('profile_settings') }}">
                            ⚙️ Profile Settings
                        </a>

                        <a href="{{ url_for('logout') }}">
                            🚪 Logout
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </nav>


    <main class="settings-page">

        <div class="settings-card">

            <h1>
                Profile Settings
            </h1>

            <p class="settings-subtitle">
                Update your AgriPredict account information
            </p>


            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            {% if success %}

                <div class="success-message">
                    {{ success }}
                </div>

            {% endif %}


            <form method="POST"
                  action="{{ url_for('profile_settings') }}">


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ user['name'] }}"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ user['email'] }}"
                        required>

                </div>


                <div class="settings-actions">

                    <button type="submit"
                            class="main-btn">

                        💾 Save Changes

                    </button>

                    <a href="{{ url_for('profile') }}"
                       class="secondary-btn">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </main>


    <footer class="footer">

        <p>
            © 2026 AgriPredict | Crop Yield Prediction
        </p>

    </footer>


</body>

</html>

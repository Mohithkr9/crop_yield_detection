 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - AgriPredict</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
            🚜
        </div>

        <!-- Application Name -->
        <h1>
            AgriPredict
        </h1>

        <p class="auth-subtitle">
            Crop Yield Prediction System
        </p>

        <!-- Page Heading -->
        <h2>
            Create Account
        </h2>


        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Registration Form -->
        <form method="POST"
              action="{{ url_for('register') }}">


            <!-- Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- Register Button -->
            <button
                type="submit"
                class="primary-button full-button">
                Register
            </button>

        </form>


        <!-- Login Link -->
        <p class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>


        <!-- Admin Login -->
        <p class="admin-link">

            <a href="{{ url_for('admin_login') }}">
                Admin Login
            </a>

        </p>

    </div>

</div>

</body>
</html>
